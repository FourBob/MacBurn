<?xml version="1.0" encoding="UTF-8"?>
<!-- Kleiner Testauftrag für MacBurn (ca. 1–2 Minuten): 30 × 30 mm Quadrat.
     Rot = Schneiden, Blau gefüllt = Gravieren, Grün = Ritzen (offene Linie). -->
<svg xmlns="http://www.w3.org/2000/svg" width="40mm" height="40mm" viewBox="0 0 40 40">
  <!-- Gravierte Fläche und Punkt -->
  <rect x="10" y="9" width="20" height="8" fill="#0000ff"/>
  <circle cx="20" cy="24" r="3" fill="#0000ff"/>
  <!-- Ritzlinie -->
  <path d="M10 31 H30" fill="none" stroke="#00ff00"/>
  <!-- Außenkontur zum Ausschneiden -->
  <rect x="5" y="5" width="30" height="30" rx="3" fill="none" stroke="#ff0000"/>
</svg>
